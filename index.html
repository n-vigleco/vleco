    <script>
        /* 1. BRAILLE DICTIONARY */
        const BRAILLE_MAP = {
            'a': '⠁', 'b': '⠃', 'c': '⠉', 'd': '⠙', 'e': '⠑', 'f': '⠋', 'g': '⠛', 'h': '⠠',
            'i': '⠊', 'j': '⠚', 'k': '⠅', 'l': '⠇', 'm': '⠍', 'n': '⠝', 'o': '⠕', 'p': '⠏',
            'q': '⠟', 'r': '⠗', 's': '⠎', 't': '⠞', 'u': '⠥', 'v': '⠧', 'w': '⠺', 'x': '⠭',
            'y': '⠽', 'z': '⠵', 'ĉ': '⠡', 'ĝ': '⠱', 'ĥ': '⠳', 'ĵ': '⠺', 'ŝ': '⠮', 'ŭ': '⠬',
            ' ': ' ', '-': '⠤', ',': '⠂', '!': '⠔'
        };

        function textToBraille(text) {
            return text.toLowerCase().split('').map(ch => BRAILLE_MAP[ch] || ch).join('');
        }

        /* 2. KEYWORD POOL & CONFIGURATION */
        const STORAGE_KEY = "vleco-orbit-settings";

        const DEFAULT_WORD_POOL = [
            "Ordigo",
            "Nutro-Regado",
            "Kuir-Artigo",
            "Korp-Kultivado",
            "Spatio-Optimumo",
            "Ordo",
            "Logit",
            "Vivi la Nunon",
            "Kultivi la Ĉirkaŭaĵon",
            "Kompari kun Si Mem"
        ];

        const params = new URLSearchParams(window.location.search);

        const defaultConfig = {
            maxDisplay: 6,
            minDisplay: 1,
            maxDisplayLimit: 12,
            radiusRatio: 0.38,
            minRadiusRatio: 0.15,
            maxRadiusRatio: 0.55,
            speed: 0.0012,
            minSpeed: 0.0002,
            maxSpeed: 0.005,
            accentColor: "#ff7b54"
        };

        let config = { ...defaultConfig };
        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function parseNumber(value, fallback, min, max) {
            const parsed = value === null || value === undefined ? NaN : Number(value);
            return Number.isFinite(parsed) ? clamp(parsed, min, max) : fallback;
        }

        function parseNumberParam(name, fallback, min, max) {
            const raw = params.get(name);
            return parseNumber(raw, fallback, min, max);
        }

        function normalizeColor(value, fallback) {
            if (!value) return fallback;
            const raw = String(value);
            const normalized = raw.startsWith("#") ? raw : `#${raw}`;
            return /^#[0-9a-fA-F]{6}$/.test(normalized) ? normalized : fallback;
        }

        function parseColorParam(fallback) {
            return normalizeColor(params.get("color"), fallback);
        }

        function parseWordsValue(raw) {
            if (!raw) return null;
            return String(raw).split(/[,|\n]/).map(word => word.trim()).filter(Boolean);
        }

        function parseWordsParam() {
            return parseWordsValue(params.get("words"));
        }

        function normalizeKeywordData(data) {
            const source = Array.isArray(data) ? data : data?.keywords;
            if (!Array.isArray(source)) return [...DEFAULT_WORD_POOL];
            const normalized = source
                .map(item => typeof item === "string" ? item : item?.label)
                .map(word => String(word || "").trim())
                .filter(Boolean);
            return normalized.length > 0 ? normalized : [...DEFAULT_WORD_POOL];
        }

        function normalizeConfigData(data) {
            const orbit = data?.orbit || {};
            return {
                maxDisplay: parseNumber(orbit.maxDisplay, defaultConfig.maxDisplay, 1, 24),
                minDisplay: parseNumber(orbit.minDisplay, defaultConfig.minDisplay, 1, 24),
                maxDisplayLimit: parseNumber(orbit.maxDisplayLimit, defaultConfig.maxDisplayLimit, 1, 24),
                radiusRatio: parseNumber(orbit.radiusRatio, defaultConfig.radiusRatio, 0.05, 0.8),
                minRadiusRatio: parseNumber(orbit.minRadiusRatio, defaultConfig.minRadiusRatio, 0.05, 0.8),
                maxRadiusRatio: parseNumber(orbit.maxRadiusRatio, defaultConfig.maxRadiusRatio, 0.05, 0.8),
                speed: parseNumber(orbit.speed, defaultConfig.speed, 0.00005, 0.02),
                minSpeed: parseNumber(orbit.minSpeed, defaultConfig.minSpeed, 0.00005, 0.02),
                maxSpeed: parseNumber(orbit.maxSpeed, defaultConfig.maxSpeed, 0.00005, 0.02),
                accentColor: normalizeColor(orbit.accentColor, defaultConfig.accentColor)
            };
        }

        function readSavedSettings() {
            try {
                const storage = window.localStorage;
                if (!storage) return null;
                const saved = JSON.parse(storage.getItem(STORAGE_KEY) || "null");
                if (!saved || typeof saved !== "object") return null;
                return {
                    config: saved.config || {},
                    words: Array.isArray(saved.words) ? saved.words.map(String).filter(Boolean) : null
                };
            } catch (error) {
                return null;
            }
        }

        function applyStoredConfig(storedConfig = {}) {
            config.maxDisplay = parseNumber(storedConfig.maxDisplay, config.maxDisplay, config.minDisplay, config.maxDisplayLimit);
            config.radiusRatio = parseNumber(storedConfig.radiusRatio, config.radiusRatio, config.minRadiusRatio, config.maxRadiusRatio);
            config.speed = parseNumber(storedConfig.speed, config.speed, config.minSpeed, config.maxSpeed);
            config.accentColor = normalizeColor(storedConfig.accentColor, config.accentColor);
        }

        function applyQueryConfig() {
            config.maxDisplay = parseNumberParam("max", config.maxDisplay, config.minDisplay, config.maxDisplayLimit);
            config.radiusRatio = parseNumberParam("radius", config.radiusRatio, config.minRadiusRatio, config.maxRadiusRatio);
            config.speed = parseNumberParam("speed", config.speed, config.minSpeed, config.maxSpeed);
            config.accentColor = parseColorParam(config.accentColor);
        }

        function persistSettings(pool) {
            try {
                const storage = window.localStorage;
                if (!storage) return;
                storage.setItem(STORAGE_KEY, JSON.stringify({
                    config: {
                        maxDisplay: config.maxDisplay,
                        radiusRatio: config.radiusRatio,
                        speed: config.speed,
                        accentColor: config.accentColor
                    },
                    words: pool
                }));
            } catch (error) {
                // URL query parameters still preserve shareable settings if storage is unavailable.
            }
        }

        function clearPersistedSettings() {
            try {
                const storage = window.localStorage;
                if (storage) storage.removeItem(STORAGE_KEY);
            } catch (error) {
                // Ignore storage errors so the visual controls remain usable.
            }
        }

        let wordPool = [...DEFAULT_WORD_POOL];
        let wordQueue = [];
        let activeSlots = [];
        let lastFrameAt = 0;
        let siteDefaultConfig = { ...defaultConfig };
        let siteDefaultWords = [...DEFAULT_WORD_POOL];

        async function loadSiteConfig() {
            try {
                const response = await fetch("site-config.json", { cache: "no-store" });
                if (!response.ok) throw new Error(`site-config.json ${response.status}`);
                const data = await response.json();
                return {
                    config: normalizeConfigData(data),
                    words: normalizeKeywordData(data)
                };
            } catch (error) {
                try {
                    const response = await fetch("keywords.json", { cache: "no-store" });
                    if (!response.ok) throw new Error(`keywords.json ${response.status}`);
                    return {
                        config: { ...defaultConfig },
                        words: normalizeKeywordData(await response.json())
                    };
                } catch (fallbackError) {
                    return {
                        config: { ...defaultConfig },
                        words: [...DEFAULT_WORD_POOL]
                    };
                }
            }
        }

        function shuffleWords(pool) {
            const temp = [...pool];
            for (let i = temp.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [temp[i], temp[j]] = [temp[j], temp[i]];
            }
            return temp;
        }

        function takeNextWord() {
            if (wordQueue.length === 0) wordQueue = shuffleWords(wordPool);
            return wordQueue.shift();
        }

        function createSlot(progress = 0) {
            return {
                word: takeNextWord(),
                progress
            };
        }

        function resetOrbit(nextPool = wordPool) {
            wordPool = nextPool.length > 0 ? nextPool : [...DEFAULT_WORD_POOL];
            wordQueue = shuffleWords(wordPool);
            const visibleCount = Math.min(config.maxDisplay, wordPool.length, config.maxDisplayLimit);
            activeSlots = Array.from({ length: visibleCount }, (_, index) => {
                const progress = index / Math.max(visibleCount, 1);
                return createSlot(progress);
            });
            lastFrameAt = performance.now();
        }

        function updateQueryFromControls(pool) {
            const nextParams = new URLSearchParams();
            nextParams.set("max", String(config.maxDisplay));
            nextParams.set("radius", String(config.radiusRatio));
            nextParams.set("speed", String(config.speed));
            nextParams.set("color", config.accentColor.replace("#", ""));

            if (pool.join("\n") !== siteDefaultWords.join("\n")) {
                nextParams.set("words", pool.join(","));
            }

            const nextUrl = `${window.location.pathname}?${nextParams.toString()}`;
            window.history.replaceState({}, "", nextUrl);
        }

        /* 3. ANIMATION ENGINE */
        const canvas = document.getElementById('orbitCanvas');
        const ctx = canvas.getContext('2d');

        let angle = 0;
        let width = 0;
        let height = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawOrbit(timestamp = performance.now()) {
            const delta = Math.min(timestamp - lastFrameAt, 64);
            lastFrameAt = timestamp;

            ctx.clearRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const minDim = Math.min(width, height);
            const radius = minDim * config.radiusRatio;

            // Subtle Ring Outline
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 123, 84, 0.12)";
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 8]);
            ctx.stroke();
            ctx.setLineDash([]);

            const count = activeSlots.length;
            if (count === 0) return;

            for (const slot of activeSlots) {
                slot.progress += config.speed * delta / 16.67;
                if (slot.progress >= 1) {
                    slot.word = takeNextWord();
                    slot.progress = 0;
                }

                const currentAngle = -Math.PI / 2 + (slot.progress * Math.PI * 2);
                const x = centerX + Math.cos(currentAngle) * radius;
                const y = centerY + Math.sin(currentAngle) * radius;

                const depth = Math.sin(currentAngle);
                const edgeFade = Math.min(1, slot.progress / 0.12, (1 - slot.progress) / 0.12);
                const alpha = (0.32 + (depth + 1) * 0.28) * edgeFade;
                const scale = 0.85 + (depth + 1) * 0.15;

                ctx.save();
                ctx.translate(x, y);

                const word = slot.word;
                const braille = textToBraille(word);

                ctx.fillStyle = config.accentColor;
                ctx.globalAlpha = alpha;
                ctx.font = `${16 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                ctx.letterSpacing = `${0.06 * scale}em`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                
                ctx.shadowColor = config.accentColor;
                ctx.shadowBlur = 8 * alpha;

                ctx.fillText(word, 0, -2);

                ctx.fillStyle = "#e2e8f0";
                ctx.globalAlpha = alpha * 0.75;
                ctx.font = `${13.5 * scale}px "Noto Sans Braille", "Apple Color Emoji", monospace`;
                ctx.letterSpacing = `${0.14 * scale}em`;
                ctx.textBaseline = 'top';
                ctx.shadowBlur = 0;
                ctx.fillText(braille, 0, 6);
                ctx.letterSpacing = "0px";

                ctx.restore();
            }

            requestAnimationFrame(drawOrbit);
        }

        /* 4. CONTROL PANEL LOGIC */
        const panel = document.getElementById('controlPanel');
        const toggleBtn = document.getElementById('toggleControlsBtn');
        const closeBtn = document.getElementById('closeControlsBtn');
        const saveBtn = document.getElementById('saveControlsBtn');
        const randomizeBtn = document.getElementById('randomizeBtn');
        const resetControlsBtn = document.getElementById('resetControlsBtn');

        const maxDisplayInput = document.getElementById('maxDisplayInput');
        const radiusInput = document.getElementById('radiusInput');
        const speedInput = document.getElementById('speedInput');
        const colorInput = document.getElementById('colorInput');
        const wordsInput = document.getElementById('wordsInput');

        const maxDisplayVal = document.getElementById('maxDisplayVal');
        const radiusVal = document.getElementById('radiusVal');
        const speedVal = document.getElementById('speedVal');
        const colorVal = document.getElementById('colorVal');

        function syncControlsFromConfig() {
            maxDisplayInput.min = String(config.minDisplay);
            maxDisplayInput.max = String(config.maxDisplayLimit);
            radiusInput.min = String(config.minRadiusRatio);
            radiusInput.max = String(config.maxRadiusRatio);
            speedInput.min = String(config.minSpeed);
            speedInput.max = String(config.maxSpeed);

            maxDisplayInput.value = String(config.maxDisplay);
            radiusInput.value = String(config.radiusRatio);
            speedInput.value = String(config.speed);
            colorInput.value = config.accentColor;

            maxDisplayVal.textContent = String(config.maxDisplay);
            radiusVal.textContent = String(config.radiusRatio);
            speedVal.textContent = String(config.speed);
            colorVal.textContent = config.accentColor;
        }

        toggleBtn.addEventListener('click', () => panel.classList.remove('hidden'));
        closeBtn.addEventListener('click', () => panel.classList.add('hidden'));

        maxDisplayInput.addEventListener('input', (e) => maxDisplayVal.textContent = e.target.value);
        radiusInput.addEventListener('input', (e) => radiusVal.textContent = e.target.value);
        speedInput.addEventListener('input', (e) => speedVal.textContent = e.target.value);
        colorInput.addEventListener('input', (e) => colorVal.textContent = e.target.value);

        randomizeBtn.addEventListener('click', () => {
            const lines = wordsInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            config.maxDisplay = parseInt(maxDisplayInput.value, 10);
            resetOrbit(lines);
            updateQueryFromControls(lines);
        });

        saveBtn.addEventListener('click', () => {
            config.maxDisplay = parseNumber(maxDisplayInput.value, config.maxDisplay, config.minDisplay, config.maxDisplayLimit);
            config.radiusRatio = parseNumber(radiusInput.value, config.radiusRatio, config.minRadiusRatio, config.maxRadiusRatio);
            config.speed = parseNumber(speedInput.value, config.speed, config.minSpeed, config.maxSpeed);
            config.accentColor = normalizeColor(colorInput.value, config.accentColor);
            const lines = wordsInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            resetOrbit(lines);
            syncControlsFromConfig();
            persistSettings(lines);
            updateQueryFromControls(lines);

            panel.classList.add('hidden');
        });

        resetControlsBtn.addEventListener('click', () => {
            clearPersistedSettings();
            config = { ...siteDefaultConfig };
            const defaultWords = [...siteDefaultWords];
            wordsInput.value = defaultWords.join('\n');
            syncControlsFromConfig();
            resetOrbit(defaultWords);
            window.history.replaceState({}, "", window.location.pathname);
        });

        loadSiteConfig().then(siteConfig => {
            config = { ...config, ...siteConfig.config };
            siteDefaultConfig = { ...config };
            siteDefaultWords = siteConfig.words.length > 0 ? siteConfig.words : [...DEFAULT_WORD_POOL];
            let initialWords = siteConfig.words.length > 0 ? siteConfig.words : [...DEFAULT_WORD_POOL];

            const saved = readSavedSettings();
            if (saved) {
                applyStoredConfig(saved.config);
                if (saved.words && saved.words.length > 0) initialWords = saved.words;
            }

            const queryWords = parseWordsParam();
            if (queryWords && queryWords.length > 0) initialWords = queryWords;
            applyQueryConfig();

            wordsInput.value = initialWords.join('\n');
            syncControlsFromConfig();
            resetOrbit(initialWords);
            requestAnimationFrame(drawOrbit);
        });
    </script>
</body>
</html>
